[package]
name = "cargo-prune-superseded"
description = "Prune superseded cargo build output by modification time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["cargo", "cargo-subcommand", "target", "clean", "disk"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[lib]
name = "cargo_prune_superseded"
path = "src/lib.rs"

[[bin]]
name = "cargo-prune-superseded"
path = "src/main.rs"

[dependencies]
clap.workspace = true
onebudgetspec-core = "=0.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
prune-fixtures.workspace = true
filetime = "0.2.29"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
fs2 = "0.4.3"
winapi-util = "0.1.11"
