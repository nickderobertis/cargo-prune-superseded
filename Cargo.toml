[workspace]
resolver = "3"
members = [
    "crates/cargo-prune-superseded",
    "crates/cargo-prune-superseded-e2e",
    "crates/dev-setup-e2e",
    "crates/repo-checks",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nickderobertis/cargo-prune-superseded"
authors = ["Nick DeRobertis"]

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }

assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_norway = "0.9.42"
tempfile = "3.27.0"
toml = "1.1.8"

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

[profile.release]
strip = true
